        // Jitsi Meet Video Call Manager (Free & Open Source!)
        let jitsiApi = null;
        let videoContainer = null;
        
        window.startVideoCall = function(roomUrl) {
            console.log('Starting Jitsi video call:', roomUrl);
            
            videoContainer = document.getElementById('video-call-container');
            const frame = document.getElementById('jitsi-video-frame');
            
            if (!videoContainer || !frame) {
                console.error('Video container not found');
                return;
            }
            
            // Extract room name from URL (format: https://meet.jit.si/RoomName)
            const roomName = roomUrl.split('/').pop();
            
            // Jitsi Meet configuration
            const domain = '8x8.vc';
            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: frame,
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    enableWelcomePage: false,
                    prejoinPageEnabled: false,
                    disableDeepLinking: true
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: [
                        'microphone', 'camera', 'closedcaptions', 'desktop',
                        'fullscreen', 'fodeviceselection', 'hangup',
                        'chat', 'recording', 'livestreaming', 'etherpad',
                        'sharedvideo', 'settings', 'raisehand',
                        'videoquality', 'filmstrip', 'stats', 'shortcuts',
                        'tileview', 'download', 'help', 'mute-everyone'
                    ],
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false
                }
            };
            
            // Create Jitsi Meet instance
            jitsiApi = new JitsiMeetExternalAPI(domain, options);
            
            // Show the video container
            videoContainer.classList.add('active');
            
            // Handle when user leaves the call
            jitsiApi.addEventListener('readyToClose', () => {
                console.log('User left the call');
                endVideoCall();
            });
            
            jitsiApi.addEventListener('videoConferenceJoined', () => {
                console.log('Joined video conference');
            });
        };
        
        window.endVideoCall = function() {
            console.log('Ending video call');
            
            if (jitsiApi) {
                jitsiApi.dispose();
                jitsiApi = null;
            }
            
            if (videoContainer) {
                videoContainer.classList.remove('active');
            }
        };
        
        // Prevent extension interference with input handling
        const originalAddEventListener = Element.prototype.addEventListener;
        const blockedExtensionPatterns = [
            'grammarly', 'lastpass', 'dashlane', 'bitwarden', 
            '1password', 'roboform', 'keepass', 'password'
        ];
        
        // Block suspicious extension listeners
        Element.prototype.addEventListener = function(type, listener, options) {
            const listenerStr = listener.toString().toLowerCase();
            const isBlocked = blockedExtensionPatterns.some(pattern => listenerStr.includes(pattern));
            if (!isBlocked || !['input', 'change', 'paste', 'cut', 'copy', 'keydown', 'keyup'].includes(type)) {
                originalAddEventListener.call(this, type, listener, options);
            }
        };

        // Remove loading screen when app loads
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.display = 'none';
                }
            }, 500);
            
            // Protect the canvas from extension manipulation
            const canvas = document.getElementById('the_canvas_id');
            if (canvas) {
                // Mark canvas as protected
                canvas.setAttribute('data-protected', 'true');
                canvas.setAttribute('data-app', 'messenger');
                
                // Prevent right-click context menus (common extension vector)
                canvas.addEventListener('contextmenu', e => e.preventDefault());
                
                // Prevent drag/drop interference
                canvas.addEventListener('dragover', e => e.preventDefault());
                canvas.addEventListener('drop', e => e.preventDefault());
            }
        });
        
        // Block common extension scripts from modifying the DOM
        const originalMutationHandler = MutationObserver.prototype;
        const originalObserve = MutationObserver.prototype.observe;
        
        MutationObserver.prototype.observe = function(target, options) {
            // Allow mutations only on our protected canvas area
            if (target && target.id !== 'the_canvas_id' && target !== document.body) {
                // Check if this looks like an extension trying to inject
                const stack = new Error().stack || '';
                if (stack.includes('chrome-extension://') || stack.includes('moz-extension://')) {
                    return; // Block extension DOM observers
                }
            }
            return originalObserve.call(this, target, options);
        };
