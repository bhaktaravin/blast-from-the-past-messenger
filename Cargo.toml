[package]
name = "chatmessagediscordclone"
version = "0.1.6"
edition = "2024"

# Define binaries explicitly
[[bin]]
name = "chatmessagediscordclone"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = []
server = []  # Feature to enable server binary (native only)

[dependencies]
eframe = { version = "0.27", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.27"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock", "wasmbind"] }
rand = "0.8"
uuid = { version = "1.7", features = ["v4", "serde", "js"] }

# Native dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
argon2 = "0.5"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
rodio = "0.19"
rust-embed = { version = "8.11", features = ["compression"] }

# Web dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "ErrorEvent", "BinaryType", "CloseEvent"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
getrandom = { version = "0.2", features = ["js"] }
