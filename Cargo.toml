[package]
name = "chatmessagediscordclone"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde", "clock"] }
rand = "0.8"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
self_update = { version = "0.41", features = ["archive-zip"] }
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }
dirs = "5.0"
reqwest = { version = "0.11", features = ["blocking", "stream"] }

[package.metadata.bundle]
name = "BlastFromThePast"
identifier = "com.blastfromthepast"
category = "public.app-category.social-networking"
