[package]
name = "chatmessagediscordclone"
# Release builds are stamped with the git tag's version by .github/workflows/release.yml
version = "1.2.6"
edition = "2021"
description = "Retro AOL-style instant messenger"
homepage = "https://github.com/bhaktaravin/blast-from-the-past-messenger"

# Linux packages (built in CI with cargo-deb / cargo-generate-rpm after `cargo build --release --features client`)
[package.metadata.deb]
name = "blast-from-the-past"
maintainer = "Ravin Bhakta <ravin.bhakta@gmail.com>"
copyright = "Ravin Bhakta. All rights reserved."
license-file = ["packaging/linux/COPYRIGHT", "0"]
extended-description = "Blast From The Past Messenger: a retro AOL-style instant messenger with buddy lists, chat rooms, end-to-end encrypted DMs and more."
section = "net"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/chatmessagediscordclone", "usr/bin/blast-from-the-past", "755"],
    ["packaging/linux/blast-from-the-past.desktop", "usr/share/applications/", "644"],
    ["assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/blast-from-the-past.png", "644"],
    ["assets/icons/icon.svg", "usr/share/icons/hicolor/scalable/apps/blast-from-the-past.svg", "644"],
]

[package.metadata.generate-rpm]
name = "blast-from-the-past"
summary = "Retro AOL-style instant messenger"
license = "All rights reserved"
assets = [
    { source = "target/release/chatmessagediscordclone", dest = "/usr/bin/blast-from-the-past", mode = "755" },
    { source = "packaging/linux/blast-from-the-past.desktop", dest = "/usr/share/applications/blast-from-the-past.desktop", mode = "644" },
    { source = "assets/icons/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/blast-from-the-past.png", mode = "644" },
    { source = "assets/icons/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/blast-from-the-past.svg", mode = "644" },
]

# Define binaries explicitly
[[bin]]
name = "chatmessagediscordclone"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = []
server = []  # Feature to enable server binary (native only)
client = ["eframe", "egui", "rodio", "notify-rust", "rfd"]  # Feature to enable audio/client deps

[dependencies]
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock", "wasmbind"] }
rand = "0.8"
uuid = { version = "1.7", features = ["v4", "serde", "js"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
dirs = "5"
once_cell = "1.19"

# Native dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
argon2 = "0.5"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
rodio = { version = "0.19", optional = true }
rust-embed = { version = "8.11", features = ["compression"] }
redis = { version = "0.25", features = ["tokio-comp"] }
notify-rust = { version = "4", optional = true }
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"], default-features = false }
open = "5.0"
rfd = { version = "0.15", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Web dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "ErrorEvent", "BinaryType", "CloseEvent", "HtmlAudioElement", "Document", "Window", "HtmlElement", "Storage"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
getrandom = { version = "0.2", features = ["js"] }
gloo-net = { version = "0.2", features = ["websocket"] }
gloo-utils = "0.1"
gloo-timers = { version = "0.2", features = ["futures"] }
rust-embed = { version = "8.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
