[package]
name = "chatmessagediscordclone"
version = "0.1.6"
edition = "2021"

# Define binaries explicitly
[[bin]]
name = "chatmessagediscordclone"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = []
server = []  # Feature to enable server binary (native only)
client = ["eframe", "egui", "rodio"]  # Feature to enable audio/client deps

[dependencies]
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock", "wasmbind"] }
rand = "0.8"
uuid = { version = "1.7", features = ["v4", "serde", "js"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
base64 = "0.22"

# Native dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
argon2 = "0.5"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
rodio = { version = "0.19", optional = true }
rust-embed = { version = "8.11", features = ["compression"] }
redis = { version = "0.25", features = ["tokio-comp"] }

# Web dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "ErrorEvent", "BinaryType", "CloseEvent"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
getrandom = { version = "0.2", features = ["js"] }
gloo-net = { version = "0.2", features = ["websocket"] }
gloo-utils = "0.1"
gloo-timers = { version = "0.2", features = ["futures"] }
