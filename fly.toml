# fly.toml app configuration file generated for blast-from-the-past-messenger on 2026-02-10T13:25:35-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'blast-from-the-past-messenger'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.server'

[env]
  BIND_ADDR = '0.0.0.0:9001'

[http_service]
  internal_port = 9001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
