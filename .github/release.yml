changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: New Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Docs
      labels:
        - docs
    - title: Chores
      labels:
        - chore
        - ci
    - title: Other
      labels:
        - "*"
