name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/server.exe dist/
          Copy-Item target/release/chatmessagediscordclone.exe dist/
          Copy-Item scripts/release/run.bat dist/
          Compress-Archive -Path dist/* -DestinationPath dist/aol-style-messenger-windows.zip -Force

      - name: Build installer
        run: iscc scripts/installer/installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aol-style-messenger-windows
          path: dist/aol-style-messenger-windows.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aol-style-messenger-installer
          path: dist/blast-from-the-past-messenger-setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aol-style-messenger-windows.zip
            dist/blast-from-the-past-messenger-setup.exe
          generate_release_notes: true
