name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client

      - name: Build Installer (Inno Setup)
        run: |
          choco install innosetup -y
          iscc scripts/installer/installer.iss

      - name: Upload Installer
        uses: softprops/action-gh-release@v1
        with:
          files: ./dist/blast-from-the-past-messenger-setup.exe
          tag_name: ${{ needs.create-release.outputs.version }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build for Intel (x86_64)
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client --target x86_64-apple-darwin

      - name: Build for Apple Silicon (ARM64)
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/chatmessagediscordclone \
            target/aarch64-apple-darwin/release/chatmessagediscordclone \
            -output target/release/chatmessagediscordclone

      - name: Create DMG
        run: |
          chmod +x .github/scripts/create-macos-app.sh
          ./.github/scripts/create-macos-app.sh

      - name: Upload DMG
        uses: softprops/action-gh-release@v1
        with:
          files: ./blast-from-the-past-macos.dmg
          tag_name: ${{ needs.create-release.outputs.version }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libglib2.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client

      - name: Create tarball
        run: |
          tar -czf blast-from-the-past-linux-x86_64.tar.gz \
            -C target/release chatmessagediscordclone

      - name: Upload Linux Binary
        uses: softprops/action-gh-release@v1
        with:
          files: ./blast-from-the-past-linux-x86_64.tar.gz
          tag_name: ${{ needs.create-release.outputs.version }}
