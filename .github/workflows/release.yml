name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgres://postgres:[YOUR-PASSWORD]@wcllqcbmnnxkllkmdkid.db.us-west-2.nhost.run:5432/wcllqcbmnnxkllkmdkid" >> $GITHUB_ENV
      - name: Build
        run: cargo build --release --bin chatmessagediscordclone

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p "target/release/Blast From The Past.app/Contents/MacOS"
          mkdir -p "target/release/Blast From The Past.app/Contents/Resources"
          cp target/release/chatmessagediscordclone "target/release/Blast From The Past.app/Contents/MacOS/"
          
          cat > "target/release/Blast From The Past.app/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>chatmessagediscordclone</string>
              <key>CFBundleIdentifier</key>
              <string>com.blastfromthepast.messenger</string>
              <key>CFBundleName</key>
              <string>Blast From The Past</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
          </dict>
          </plist>
          EOF
          
          hdiutil create -volname "Blast From The Past" -srcfolder "target/release/Blast From The Past.app" -ov -format UDZO "blast-from-the-past-macos.dmg"

      - name: Upload DMG
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./blast-from-the-past-macos.dmg
          asset_name: blast-from-the-past-macos.dmg
          asset_content_type: application/octet-stream

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgres://postgres:[YOUR-PASSWORD]@wcllqcbmnnxkllkmdkid.db.us-west-2.nhost.run:5432/wcllqcbmnnxkllkmdkid" >> $GITHUB_ENV
      - name: Build
        run: cargo build --release --bin chatmessagediscordclone

      - name: Create Zip
        shell: powershell
        run: |
          Compress-Archive -Path target/release/chatmessagediscordclone.exe,assets -DestinationPath blast-from-the-past-windows.zip

      - name: Upload Windows Zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./blast-from-the-past-windows.zip
          asset_name: blast-from-the-past-windows.zip
          asset_content_type: application/zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgres://postgres:[YOUR-PASSWORD]@wcllqcbmnnxkllkmdkid.db.us-west-2.nhost.run:5432/wcllqcbmnnxkllkmdkid" >> $GITHUB_ENV
      - name: Build
        run: cargo build --release --bin chatmessagediscordclone

      - name: Create tarball
        run: |
          cd target/release
          tar -czf ../../blast-from-the-past-linux-x86_64.tar.gz chatmessagediscordclone
          cd ../..

      - name: Upload Linux Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./blast-from-the-past-linux-x86_64.tar.gz
          asset_name: blast-from-the-past-linux-x86_64.tar.gz
          asset_content_type: application/gzip
