name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client

      - name: Build Installer (Inno Setup)
        run: |
          choco install innosetup -y
          iscc scripts/installer/installer.iss

      - name: Upload Installer
        uses: softprops/action-gh-release@v1
        with:
          files: ./dist/blast-from-the-past-messenger-setup.exe
          tag_name: ${{ needs.create-release.outputs.version }}

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-intel-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build for Intel
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client --target x86_64-apple-darwin

      - name: Prepare binary
        run: |
          mkdir -p target/release
          cp target/x86_64-apple-darwin/release/chatmessagediscordclone target/release/

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

      - name: Create and sign app bundle
        run: |
          chmod +x .github/scripts/create-macos-app.sh
          ./.github/scripts/create-macos-app.sh
          codesign --deep --force --verify --verbose \
            --sign "Developer ID Application: Ravin Bhakta (VLJG47KK4K)" \
            --options runtime \
            "target/release/Blast From The Past.app"

      - name: Notarize app
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PWD: ${{ secrets.NOTARIZATION_PWD }}
        run: |
          ditto -c -k --keepParent "target/release/Blast From The Past.app" app-intel.zip
          xcrun notarytool submit app-intel.zip \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PWD" \
            --team-id "VLJG47KK4K" \
            --wait
          xcrun stapler staple "target/release/Blast From The Past.app"

      - name: Create signed DMG
        run: |
          mv blast-from-the-past-macos.dmg blast-from-the-past-macos-intel.dmg
          codesign --sign "Developer ID Application: Ravin Bhakta (VLJG47KK4K)" \
            blast-from-the-past-macos-intel.dmg

      - name: Upload Intel DMG
        uses: softprops/action-gh-release@v1
        with:
          files: ./blast-from-the-past-macos-intel.dmg
          tag_name: ${{ needs.create-release.outputs.version }}

  build-macos-silicon:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-silicon-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build for Apple Silicon
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client --target aarch64-apple-darwin

      - name: Prepare binary
        run: |
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/chatmessagediscordclone target/release/

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

      - name: Create and sign app bundle
        run: |
          chmod +x .github/scripts/create-macos-app.sh
          ./.github/scripts/create-macos-app.sh
          codesign --deep --force --verify --verbose \
            --sign "Developer ID Application: Ravin Bhakta (VLJG47KK4K)" \
            --options runtime \
            "target/release/Blast From The Past.app"

      - name: Notarize app
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PWD: ${{ secrets.NOTARIZATION_PWD }}
        run: |
          ditto -c -k --keepParent "target/release/Blast From The Past.app" app-silicon.zip
          xcrun notarytool submit app-silicon.zip \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PWD" \
            --team-id "VLJG47KK4K" \
            --wait
          xcrun stapler staple "target/release/Blast From The Past.app"

      - name: Create signed DMG
        run: |
          mv blast-from-the-past-macos.dmg blast-from-the-past-macos-silicon.dmg
          codesign --sign "Developer ID Application: Ravin Bhakta (VLJG47KK4K)" \
            blast-from-the-past-macos-silicon.dmg

      - name: Upload Silicon DMG
        uses: softprops/action-gh-release@v1
        with:
          files: ./blast-from-the-past-macos-silicon.dmg
          tag_name: ${{ needs.create-release.outputs.version }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libglib2.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client

      - name: Create tarball
        run: |
          tar -czf blast-from-the-past-linux-x86_64.tar.gz \
            -C target/release chatmessagediscordclone

      - name: Upload Linux Binary
        uses: softprops/action-gh-release@v1
        with:
          files: ./blast-from-the-past-linux-x86_64.tar.gz
          tag_name: ${{ needs.create-release.outputs.version }}
