name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client

      - name: Build Installer (Inno Setup)
        run: |
          choco install innosetup -y
          iscc scripts/installer/installer.iss

      - name: Upload Installer
        uses: softprops/action-gh-release@v1
        with:
          files: ./dist/blast-from-the-past-messenger-setup.exe
          tag_name: ${{ needs.create-release.outputs.version }}

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-intel-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build for Intel
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client --target x86_64-apple-darwin

      - name: Prepare binary
        run: |
          mkdir -p target/release
          cp target/x86_64-apple-darwin/release/chatmessagediscordclone target/release/

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          printf "%s" "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          echo "Certificate size: $(wc -c < certificate.p12) bytes"
          # Create a PKCS12 without password for security import compatibility
          openssl pkcs12 -in certificate.p12 -passin pass:blast123 -out cert_nopass.pem -nodes
          openssl pkcs12 -export -in cert_nopass.pem -out certificate_import.p12 -passout pass:actions
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate_import.p12 -k build.keychain -P "actions" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          echo "=== Codesigning identities ==="
          security find-identity -v -p codesigning build.keychain

      - name: Create app bundle, sign and notarize
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PWD: ${{ secrets.NOTARIZATION_PWD }}
        run: |
          chmod +x .github/scripts/create-macos-app.sh
          ./.github/scripts/create-macos-app.sh
          security unlock-keychain -p actions build.keychain
          echo "=== Identities before signing ==="
          security find-identity -v -p codesigning
          codesign --deep --force --verify --verbose \
            --keychain build.keychain \
            --sign "Developer ID Application: Ravin Bhakta (VLJG47KK4K)" \
            --options runtime \
            "target/release/Blast From The Past.app"
          ditto -c -k --keepParent "target/release/Blast From The Past.app" app-intel.zip
          xcrun notarytool submit app-intel.zip \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PWD" \
            --team-id "VLJG47KK4K" \
            --wait
          xcrun stapler staple "target/release/Blast From The Past.app"
          mv blast-from-the-past-macos.dmg blast-from-the-past-macos-intel.dmg
          codesign --keychain build.keychain \
            --sign "Developer ID Application: Ravin Bhakta (VLJG47KK4K)" \
            blast-from-the-past-macos-intel.dmg

      - name: Upload Intel DMG
        uses: softprops/action-gh-release@v1
        with:
          files: ./blast-from-the-past-macos-intel.dmg
          tag_name: ${{ needs.create-release.outputs.version }}

  build-macos-silicon:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-silicon-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build for Apple Silicon
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client --target aarch64-apple-darwin

      - name: Prepare binary
        run: |
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/chatmessagediscordclone target/release/

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          printf "%s" "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          echo "Certificate size: $(wc -c < certificate.p12) bytes"
          openssl pkcs12 -in certificate.p12 -passin pass:blast123 -out cert_nopass.pem -nodes
          openssl pkcs12 -export -in cert_nopass.pem -out certificate_import.p12 -passout pass:actions
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate_import.p12 -k build.keychain -P "actions" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning build.keychain

      - name: Create app bundle, sign and notarize
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PWD: ${{ secrets.NOTARIZATION_PWD }}
        run: |
          chmod +x .github/scripts/create-macos-app.sh
          ./.github/scripts/create-macos-app.sh
          security unlock-keychain -p actions build.keychain
          codesign --deep --force --verify --verbose \
            --keychain build.keychain \
            --sign "Developer ID Application: Ravin Bhakta (VLJG47KK4K)" \
            --options runtime \
            "target/release/Blast From The Past.app"
          ditto -c -k --keepParent "target/release/Blast From The Past.app" app-silicon.zip
          xcrun notarytool submit app-silicon.zip \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PWD" \
            --team-id "VLJG47KK4K" \
            --wait
          xcrun stapler staple "target/release/Blast From The Past.app"
          mv blast-from-the-past-macos.dmg blast-from-the-past-macos-silicon.dmg
          codesign --keychain build.keychain \
            --sign "Developer ID Application: Ravin Bhakta (VLJG47KK4K)" \
            blast-from-the-past-macos-silicon.dmg

      - name: Upload Silicon DMG
        uses: softprops/action-gh-release@v1
        with:
          files: ./blast-from-the-past-macos-silicon.dmg
          tag_name: ${{ needs.create-release.outputs.version }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libglib2.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --bin chatmessagediscordclone --features client

      - name: Create tarball
        run: |
          tar -czf blast-from-the-past-linux-x86_64.tar.gz \
            -C target/release chatmessagediscordclone

      - name: Upload Linux Binary
        uses: softprops/action-gh-release@v1
        with:
          files: ./blast-from-the-past-linux-x86_64.tar.gz
          tag_name: ${{ needs.create-release.outputs.version }}

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: [build-macos-intel, build-macos-silicon, create-release]
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: bhaktaravin/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download Intel DMG and get checksum
        if: needs.build-macos-intel.result == 'success'
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          curl -L -o intel.dmg "https://github.com/bhaktaravin/blast-from-the-past-messenger/releases/download/${VERSION}/blast-from-the-past-macos-intel.dmg"
          echo "INTEL_SHA=$(shasum -a 256 intel.dmg | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Download Silicon DMG and get checksum
        if: needs.build-macos-silicon.result == 'success'
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          curl -L -o silicon.dmg "https://github.com/bhaktaravin/blast-from-the-past-messenger/releases/download/${VERSION}/blast-from-the-past-macos-silicon.dmg"
          echo "SILICON_SHA=$(shasum -a 256 silicon.dmg | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Update cask formula
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          VERSION_NUM=${VERSION#v}
          CASK_FILE="homebrew-tap/Casks/blast-from-the-past.rb"

          cat > "$CASK_FILE" << CASK
          cask "blast-from-the-past" do
            version "${VERSION_NUM}"

            on_intel do
              url "https://github.com/bhaktaravin/blast-from-the-past-messenger/releases/download/v#{version}/blast-from-the-past-macos-intel.dmg"
              sha256 "${INTEL_SHA:-to_be_updated}"
            end

            on_arm do
              url "https://github.com/bhaktaravin/blast-from-the-past-messenger/releases/download/v#{version}/blast-from-the-past-macos-silicon.dmg"
              sha256 "${SILICON_SHA:-to_be_updated}"
            end

            name "Blast From The Past"
            desc "Retro AOL-style instant messenger"
            homepage "https://github.com/bhaktaravin/blast-from-the-past-messenger"

            app "Blast From The Past.app"

            zap trash: [
              "~/.config/blast-from-the-past",
            ]
          end
          CASK

      - name: Commit and push cask update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/blast-from-the-past.rb
          git diff --staged --quiet || git commit -m "Update blast-from-the-past to ${{ needs.create-release.outputs.version }}"
          git push
